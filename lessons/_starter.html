  id: 'sXX',

  next: 'sYY, the next topic.'
});

// The session's visual. Kit.tick(n) ticks mission item n; Kit.store is per-lesson localStorage.
const seen = new Set();
[3, 1, 4].forEach((v, i) => {
  const b = Kit.el('button', 'demo-cell', String(v)); b.type = 'button';
  b.addEventListener('click', () => { b.classList.add('on'); seen.add(i); Kit.$('demo-narr').textContent = 'nums[' + i + '] is ' + v + '.'; if (seen.size === 3) Kit.tick(1); });
  Kit.$('demo').appendChild(b);
});
</script>
